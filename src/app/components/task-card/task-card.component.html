<div class="task-card" [class.completed]="isCompleted()">
  <!-- Header: Type + Priority -->
  <div class="flex justify-between items-start gap-3 mb-3">
    <!-- Type Badge -->
    <span
      class="text-xs font-medium px-3 py-1 rounded-full"
      [style.backgroundColor]="getTypeColor(task.taskType)"
      [style.color]="'#1A1A1A'"
    >
      {{ task.taskType }}
    </span>

    <!-- Priority Badge -->
    <span
      class="text-xs font-medium px-3 py-1 rounded-full text-white"
      [style.backgroundColor]="getPriorityColor(task.priority)"
    >
      {{ task.priority }}
    </span>
  </div>

  <!-- Task Code -->
  <div class="text-xs text-gray-500 mb-2">{{ task.jobTaskId }}</div>

  <!-- Task Title -->
  <h3 class="font-serif text-lg font-light mb-2" [class.line-through]="isCompleted()">
    {{ task.taskTitle }}
  </h3>

  <!-- Description (truncated) -->
  <p class="text-sm text-gray-600 mb-4 line-clamp-2">
    {{ task.taskDescription }}
  </p>

  <!-- Footer: Assignee + Due Date -->
  <div class="flex justify-between items-center pt-3" style="border-top: 1px solid #E5E0D5;">
    <!-- Assignee -->
    <div class="flex items-center gap-2">
      <span class="text-xs text-gray-600">To</span>
      <app-avatar
        *ngIf="task.assignee"
        [staff]="task.assignee"
        [size]="24"
      />
      <span class="text-xs font-medium">{{ task.assignee?.name || 'Unassigned' }}</span>
    </div>

    <!-- Due Date / Overdue -->
    <span
      class="text-xs font-medium"
      [ngClass]="{
        'text-red-600': isOverdue(),
        'text-gray-600': !isOverdue()
      }"
    >
      {{ isOverdue() ? 'Overdue' : formatDate(task.dueDate) }}
    </span>
  </div>

  <!-- Status Badge -->
  <div class="mt-3 pt-3" style="border-top: 1px solid #E5E0D5;">
    <span
      class="text-xs font-medium px-3 py-1 rounded-full text-white inline-block"
      [style.backgroundColor]="getStatusColor(task.jobStatus)"
    >
      {{ getStatusLabel(task.jobStatus) }}
    </span>
  </div>
</div>
