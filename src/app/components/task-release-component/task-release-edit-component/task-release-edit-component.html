<div class="task-release-edit-page">
  <p-toast />

  @if (loadingState() === LoadingState.Loading) {
    <div class="spinner-wrapper">
      <p-progressSpinner strokeWidth="4" fill="transparent" />
    </div>
  } @else if (loadingState() === LoadingState.Error) {
    <div class="error-state">
      <i class="pi pi-exclamation-triangle"></i>
      <span>Failed to load task release.</span>
      <p-button label="Cancel" icon="pi pi-arrow-left" (onClick)="cancel()" severity="secondary" />
    </div>
  } @else {
    <div class="page-toolbar">
      <div class="toolbar-left">
        <p-button icon="pi pi-arrow-left" label="Back" severity="secondary" (onClick)="cancel()" />
        <h2 class="page-title"><i class="pi pi-pencil"></i> Edit Task Release</h2>
      </div>
    </div>

    <p-card styleClass="detail-card">
      <ng-template pTemplate="header">
        <div class="card-header-bar">
          <div class="card-title">
            <i class="pi pi-send"></i>
            <span>Release Details</span>
          </div>
        </div>
      </ng-template>

      <div class="edit-form-grid">
        <div class="form-field">
          <label for="releaseId">Release ID <span class="required">*</span></label>
          <input
            id="releaseId"
            type="text"
            pInputText
            [ngModel]="releaseIdField()"
            (ngModelChange)="releaseIdField.set($event)"
            placeholder="e.g. REL-2026-0001"
          />
        </div>

        <div class="form-field">
          <label for="releaseVersion">Release Version <span class="required">*</span></label>
          <input
            id="releaseVersion"
            type="text"
            pInputText
            [ngModel]="releaseVersion()"
            (ngModelChange)="releaseVersion.set($event)"
            placeholder="e.g. v1.4.0"
          />
        </div>

        <div class="form-field">
          <label for="releaseDate">Release Date <span class="required">*</span></label>
          <p-datepicker
            id="releaseDate"
            [(ngModel)]="releaseDate"
            dateFormat="dd/mm/yy"
            [showIcon]="true"
          />
        </div>

        <div class="form-field form-field-wide">
          <label for="releaseRemarks">Release Remarks</label>
          <textarea
            id="releaseRemarks"
            pTextarea
            rows="2"
            [ngModel]="releaseRemarks()"
            (ngModelChange)="releaseRemarks.set($event)"
            placeholder="Optional remarks"
          ></textarea>
        </div>
      </div>

      <div class="edit-actions">
        <p-button label="Cancel" severity="secondary" (onClick)="cancel()" />
        <p-button
          label="Save Changes"
          icon="pi pi-check"
          [disabled]="!canSubmit()"
          [loading]="submitting()"
          (onClick)="submit()"
        />
      </div>
    </p-card>
  }
</div>
