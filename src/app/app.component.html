<!-- ============== HEADER ============== -->
<header class="header-section">
  <div class="header-content">
    <div class="header-left">
      <h1>Task Management</h1>
      <p>Manage and track job tasks efficiently</p>
    </div>
    <app-user-switcher
      *ngIf="me()"
      [me]="me()!"
      [staff]="staff()"
      (selectStaff)="onSelectStaff($event)"
    />
  </div>
</header>

<!-- ============== MAIN CONTENT ============== -->
<main class="main-section">
  <div class="container-wrapper">
    <!-- ──── SUMMARY STATS ──── -->
    <div class="stats-grid">
      <app-stat-card label="ACTIVE" [value]="activeCount()" severity="info" />
      <app-stat-card label="COMPLETED" [value]="completedCount()" severity="success" />
      <app-stat-card label="OVERDUE" [value]="overdueCount()" severity="warning" />
      <app-stat-card label="TOTAL ASSIGNED" [value]="totalCount()" severity="secondary" />
    </div>

    <!-- ──── FILTER TABS ──── -->
    <div class="filter-tabs">
      <p-button
        [label]="'I assigned ' + assignedByMeCount()"
        [filled]="filterState().groupAuthority === 'ASSIGNED_BY_ME'"
        (click)="onFilterChange('ASSIGNED_BY_ME')"
        [severity]="filterState().groupAuthority === 'ASSIGNED_BY_ME' ? 'secondary' : 'secondary'"
      />
      <p-button
        [label]="'Assigned to me ' + assignedToMeCount()"
        [filled]="filterState().groupAuthority === 'ASSIGNED_TO_ME'"
        (click)="onFilterChange('ASSIGNED_TO_ME')"
        [severity]="filterState().groupAuthority === 'ASSIGNED_TO_ME' ? 'secondary' : 'secondary'"
      />
      <p-button
        [label]="'All ' + totalCount()"
        [filled]="filterState().groupAuthority === 'ALL'"
        (click)="onFilterChange('ALL')"
        [severity]="filterState().groupAuthority === 'ALL' ? 'secondary' : 'secondary'"
      />
    </div>

    <!-- ──── SEARCH & ACTIONS ──── -->
    <div class="search-actions">
      <span class="p-input-icon-left search-box">
        <i class="pi pi-search"></i>
        <input
          pInputText
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearchChange($event)"
          placeholder="Search tasks..."
        />
      </span>

      <p-button icon="pi pi-filter" label="Filters" severity="secondary" variant="outlined" />

      <p-button
        icon="pi pi-plus"
        label="New task"
        (click)="onOpenTaskForm()"
        severity="primary"
      />
    </div>

    <!-- ──── TASK GRID ──── -->
    <div class="task-grid">
      <div *ngFor="let task of filteredTasks()" (click)="onSelectTask(task)">
        <app-task-card [task]="task" />
      </div>

      <!-- Empty State -->
      <div *ngIf="filteredTasks().length === 0 && !loading()" class="empty-state">
        <i class="pi pi-inbox"></i>
        <p>No tasks found</p>
      </div>

      <!-- Loading State -->
      <div *ngIf="loading()" class="loading-state">
        <p-skeleton height="300px" />
      </div>
    </div>
  </div>
</main>

<!-- ============== MODALS & DIALOGS ============== -->

<!-- Task Detail Drawer / Dialog -->
<app-task-detail-drawer
  *ngIf="showTaskDetail() && selectedTask()"
  [task]="selectedTask()!"
  [staff]="staff()"
  [me]="me()!"
  (close)="onCloseTaskDetail()"
  (delete)="onDeleteTask(selectedTask()!.uniqId)"
  (statusChanged)="onTaskStatusChanged()"
/>

<!-- Task Form Modal -->
<app-task-form-modal
  *ngIf="showTaskForm()"
  [staff]="staff()"
  [me]="me()!"
  (create)="onCreateTask($event)"
  (cancel)="onCloseTaskForm()"
/>

<!-- Toast Messages -->
<p-toast />
